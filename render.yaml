# Starting point for Render. Secrets stay in the dashboard (sync: false).
# Confirm the start command after the first build; Nitro prints the entry file.
services:
  - type: web
    name: flush-finder
    runtime: node
    plan: starter
    buildCommand: NITRO_PRESET=node-server FF_STORE_BUILD=1 npm run build:store
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FF_STORE_BUILD
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TWITTER_CLIENT_ID
        sync: false
      - key: TWITTER_CLIENT_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
