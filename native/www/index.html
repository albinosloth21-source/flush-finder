<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e4f4a" />
    <title>Flush Finder</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; background: #1e4f4a; }
      body {
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #f4efe6;
        padding: 2rem;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 1.1rem;
        object-fit: cover;
        box-shadow: 0 8px 24px rgb(0 0 0 / 0.28);
      }
      h1 { font-size: 1.4rem; font-weight: 650; margin: 1rem 0 0.35rem; }
      p { margin: 0; max-width: 22rem; color: #d7cfc0; line-height: 1.45; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <div>
      <img src="logo.jpg" alt="" />
      <h1>Flush Finder</h1>
      <p>Nearby restrooms, rated in toilets. Open the app on a phone build to load the live map.</p>
    </div>
  </body>
</html>
